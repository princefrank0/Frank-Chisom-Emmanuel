title: Credential Column Read By Unapproved Account
id: 4657a204-f12c-46be-ace2-c78becab6eab
status: experimental
description: |
    Detects SELECT statements that reference credential-bearing columns
    (password, PIN, secret, token) from accounts other than the application
    identity that owns them, as recorded by Imperva SecureSphere DAM audit
    events.

    Baseline finding behind this rule: credential-column reads in production
    belonged to one application account on two fixed source addresses. Any
    other account or source reading those columns is unexpected.

    Field mapping (CEF to Sigma): duser = DatabaseUser, src = SourceIp,
    cs16 = ParsedQuery.
references:
    - https://attack.mitre.org/techniques/T1213/
    - https://attack.mitre.org/techniques/T1555/
author: Frank Chisom Emmanuel
date: 2026-11-12
tags:
    - attack.collection
    - attack.t1213
    - attack.credential-access
    - attack.t1555
pci_dss:
    - '10.2.1'
    - '10.4.1.1'
logsource:
    product: imperva
    service: securesphere_dam
detection:
    selection_verb:
        ParsedQuery|startswith: 'select '
    selection_columns:
        ParsedQuery|contains:
            - 'password'
            - 'passwd'
            - 'pin_hash'
            - 'secret'
            - 'api_key'
            - 'token'
    filter_owner:
        # Replace with the owning application account and its fixed sources
        DatabaseUser: 'svc_app_identity'
        SourceIp:
            - '192.0.2.30'
            - '192.0.2.31'
    condition: selection_verb and selection_columns and not filter_owner
falsepositives:
    - Columns whose names contain the keywords but hold no credentials
level: high
